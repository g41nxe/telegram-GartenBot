# Fachliche Einstellungen des Bewässerungs-Daemons
# Secrets (Telegram-Token, PAT, User-IDs) gehören in .env — nicht hier.

# Standort für Wettervorhersage (Open-Meteo) — persönliche Werte in .env eintragen
# LATITUDE=0.0
# LONGITUDE=0.0

# MQTT-Verbindung
MQTT_BROKER_HOST=127.0.0.1
MQTT_BROKER_PORT=1883
MQTT_VALVE_TOPIC=zigbee2mqtt/garden_valve

# Regen-Fenster-Schwelle in mm (letzte + nächste 24h, erwarteter Niederschlag),
# ab der Bewässerung übersprungen wird (Faktor = 0 %). 3.0 mm ≈ 1/8" (wassersparend).
RAIN_THRESHOLD_MM=3.0

# Gießcheck-Empfehlung — Bedarfsseite (Temperatur & Hitzestrecke)
GIESSCHECK_HOT_TEMP_C=25.0
GIESSCHECK_HEAT_SENSITIVITY=0.5
GIESSCHECK_HOT_DAYS_COUNT=3

# Sicherheits-Timeout (Auto-Close am Ventil) in Minuten
SAFETY_TIMEOUT_MINUTES=30

# Batterie-Warnschwelle in Prozent
BATTERY_WARNING_THRESHOLD=20

# Vorlaufzeit der Guss-Vorwarnung in Minuten vor einem geplanten Guss, der regenbedingt
# übersprungen/reduziert würde (Feature 0034 — Regen-Übersteuerung).
RAIN_WARNING_LEAD_MINUTES=5

# Maximale Zeit zwischen zwei Durchflussmessungen in Sekunden
FLOW_TIME_GAP_CAP_SECONDS=60

# Wetter-Aktualisierungsintervall in Sekunden
WEATHER_REFRESH_INTERVAL_SECONDS=1800

# Uhrzeit für den täglichen Statusbericht (HH:MM)
DAILY_REPORT_TIME=08:00

# Unerwartete Ventilöffnung (Benachrichtigung, wenn ein Ventil ohne aktiven Guss öffnet)
UNEXPECTED_VALVE_ALERT_ENABLED=true

# Nebel-Intervall (Terrassen-Kühlung): Standard-Takt und Sicherheitsgrenzen
# Dauer eines Nebelstoßes in Sekunden
NEBEL_ON_SECONDS=20
# Pause zwischen zwei Nebelstößen in Minuten
NEBEL_PAUSE_MINUTES=5
# Maximale Laufzeit eines manuellen Sofort-Nebels in Minuten (harter Backstop)
NEBEL_MANUAL_MAX_MINUTES=120
# Empfohlener Hardware-Sicherheits-Timeout (fail_safe) fürs Nebel-Ventil in Sekunden
NEBEL_VALVE_FAIL_SAFE_SECONDS=90

# Inaktivitäts-Watchdog
WATCHDOG_ENABLED=true
WATCHDOG_VALVE_TIMEOUT_HOURS=24

# Regensensor (Aqua Scope RANWIE01) — publisht auf AQS/<geräte-id>/stat
RAIN_SENSOR_TOPIC=AQS/+/stat
RAIN_SENSOR_THRESHOLD_MM=0.1
RAIN_SENSOR_OFFLINE_HOURS=18
# Kippwaagen-Auflösung: ein Tick (rainlevel/raintotal +1) = 0,5 mm
RAIN_SENSOR_MM_PER_TICK=0.5
# battery = verbrauchte Kapazität (mAs); nutzbare Kapazität für Rest-%
# (2× AAA LiFeS2/L92, bis 2,9 V Pack-Abschaltung ≈ 1200 mAh, ~2,3 Jahre)
RAIN_SENSOR_BATTERY_CAPACITY_MAH=1200

# Garten-Kamera
CAMERA_RECEIVER_PORT=8080
CAMERA_IMAGE_DIR=data/camera
CAMERA_CLEANUP_DAYS=30
CAMERA_MAX_UPLOAD_BYTES=512000

# Getimte Kamera-Aufnahmen (Feature 0030)
# Ab wann die Bildunterschrift den Aufnahme-Verzug ausdruecklich nennt (ADR 0040).
# Entscheidet NICHT ueber die Zustellung: Ein Aufnahme-Zeitpunkt wird vom ersten Bild
# nach ihm erfuellt, egal wie spaet es kommt.
AUFNAHME_ABWEICHUNG_HINWEIS_MINUTEN=5
CAMERA_AFTER_GUSS_OFFSET_MINUTES=2
# Ab welchem Aufnahme-Verzug die Kamera-Ueberwachung eine Stoerung meldet (ADR 0041).
# Gemeldet wird erst beim zweiten Verzug in Folge.
AUFNAHME_VERZUG_SCHWELLE_MINUTEN=15
