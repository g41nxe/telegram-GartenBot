        - paragraph [ref=e133]: Matthew Freed makes functional stoneware in Strathcona, Vancouver — mugs, bowls, plates and vases meant to be used, not saved for good. Each piece is thrown by hand and glazed in one of fifteen recipes developed in the studio, where nature, science and art meet in the kiln.
